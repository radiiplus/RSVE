name: rsve-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --requirement requirements.lock
      - run: python -m pip install --no-deps --editable .
      - run: python scripts/check_dependencies.py
      - run: python -m pip check
      - run: python -m compileall -q src tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - run: pip-audit --requirement requirements.lock
